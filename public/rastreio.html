<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rastrear pedido — GameVault</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ===== CABEÇALHO (igual ao da home) ===== -->
  <header class="header">
    <div class="header-inner">
      <a href="index.html" class="logo">GAMEVAULT</a>
      <nav class="menu" id="menu">
        <a href="index.html">Início</a>
        <a href="consoles.html">Consoles</a>
        <a href="jogos.html">Jogos</a>
        <a href="acessorios.html">Acessórios</a>
        <a href="carrinho.html">Carrinho</a>
        <a href="rastreio.html" class="menu-ativo">Rastrear pedido</a>
      </nav>
      <div class="acoes">
        <a href="carrinho.html" class="icone-btn" aria-label="Carrinho de compras" title="Ver carrinho">
          <svg viewBox="0 0 24 24"><path d="M3 3h2l2.5 11h10L20 7H6"/><circle cx="9" cy="20" r="1.5"/><circle cx="17" cy="20" r="1.5"/></svg>
          <span class="badge" id="contador-carrinho">0</span>
        </a>
        <a href="login.html" class="icone-btn" aria-label="Entrar ou criar conta">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
        </a>
        <button class="icone-btn hamburguer" id="btn-menu" aria-label="Abrir menu" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <main>
    <h1 class="titulo">Rastrear pedido</h1>

    <!-- Campo de busca: código de rastreio ou número do pedido -->
    <form id="form-rastreio" class="busca">
      <input id="codigo" type="text" placeholder="Código de rastreio ou nº do pedido (ex.: GV123456789BR)" required>
      <button class="btn" type="submit">Rastrear</button>
    </form>

    <div class="alerta" id="alerta" hidden></div>

    <!-- Resultado: as 4 etapas ganham as classes "concluida" / "atual" via script.js -->
    <section class="card" id="resultado" hidden>
      <p>Pedido <strong id="r-id"></strong> — código <strong id="r-codigo"></strong></p>
      <ol class="etapas">
        <li class="etapa"><span class="bolha">📝</span><span>Pedido confirmado</span></li>
        <li class="etapa"><span class="bolha">📦</span><span>Em separação</span></li>
        <li class="etapa"><span class="bolha">🚚</span><span>Enviado</span></li>
        <li class="etapa"><span class="bolha">✅</span><span>Entregue</span></li>
      </ol>
    </section>
  </main>

  <footer class="footer">© 2026 GameVault — <a href="termos.html" style="color: #00f5d4; text-decoration: underline;">Termos de Uso e LGPD</a></footer>
  <script src="script.js?v=2"></script>
</body>
</html>
